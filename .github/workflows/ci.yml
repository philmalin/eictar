# The tests on every platform that eictar claims (doc/design.md 15.1).
#
# A cross-compile proves only that the code builds. The metadata of each
# platform - xattrs, holes, no-follow calls - differs in ways that only a test
# run on that platform finds. A platform is supported when this workflow
# passes on it, and not before.
name: ci

# A change to the documentation alone does not run the tests. The man page,
# doc/eictar.1, is not ignored: a test checks that it documents every
# option. GitHub does not apply path filters to a tag, so a release tag
# always runs the tests.
on:
  push:
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.html'
      - 'LICENSE'
  workflow_dispatch:

env:
  # go.mod asks for Go 1.27. A system package that is older fetches the right
  # toolchain itself.
  GOTOOLCHAIN: auto

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Makefile keeps the caches inside the project, where setup-go does
      # not save or restore them. Its own directories take their place here.
      - name: use the caches of setup-go
        run: echo "GODIRS=GOCACHE=$(go env GOCACHE) GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - run: make check GO=go CROSSVET= $GODIRS
      - name: skipped tests
        if: always()
        run: make skips GO=go $GODIRS
      - run: make fuzz GO=go FUZZTIME=20s $GODIRS

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The Makefile keeps the caches inside the project, where setup-go does
      # not save or restore them. Its own directories take their place here.
      - name: use the caches of setup-go
        run: echo "GODIRS=GOCACHE=$(go env GOCACHE) GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - run: make check GO=go CROSSVET= $GODIRS
      - name: skipped tests
        if: always()
        run: make skips GO=go $GODIRS

  # Windows is not a supported platform yet (doc/design.md 15.1). The job
  # shows what fails there, and its failure does not fail the workflow.
  # Windows has no make in the runner image, so the job runs go directly.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      # The checkout keeps LF line ends: with CRLF, gofmt and the tests that
      # read the files of the repository see a change.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./src/... ./tools/...
      - run: go test ./src/... ./tools/...
      - name: operational tests
        if: ${{ !cancelled() }}
        run: go test -tags operational ./src/operational/
      - name: skipped tests
        if: ${{ !cancelled() }}
        run: |
          echo "=== unit tests"
          go test -count=1 -json ./src/... | go run ./tools/testskips
          echo "=== operational tests"
          go test -count=1 -json -tags operational ./src/operational/ | go run ./tools/testskips

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          envs: GOTOOLCHAIN
          prepare: pkg install -y go gmake
          # The job's result is check's; the list of skipped tests follows it.
          run: |
            gmake check GO=go CROSSVET=; status=$?
            gmake skips GO=go
            exit $status

  netbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/netbsd-vm@v1
        with:
          envs: GOTOOLCHAIN
          prepare: /usr/sbin/pkg_add go gmake
          # pkgsrc can install Go as "go", or only with its version in the
          # name (go124). Find it without sort -V, which NetBSD does not have.
          # NetBSD has no race detector.
          run: |
            GO=$(command -v go || true)
            [ -n "$GO" ] || GO=$(ls /usr/pkg/bin/go1[0-9]* /usr/pkg/go*/bin/go 2>/dev/null | tail -1)
            echo "Go: $GO"
            gmake check-norace GO="$GO" CROSSVET=; status=$?
            gmake skips GO="$GO"
            exit $status

  openbsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/openbsd-vm@v1
        with:
          envs: GOTOOLCHAIN
          prepare: pkg_add go gmake
          # OpenBSD has no race detector.
          run: |
            gmake check-norace GO=go CROSSVET=; status=$?
            gmake skips GO=go
            exit $status
